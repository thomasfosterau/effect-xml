name: Auto-assign

# Assigns every new pull request to the repository owner unless it already
# has an assignee. Dependabot's PRs are skipped: `.github/dependabot.yml`
# assigns them. This uses `pull_request` (never `pull_request_target`), so a
# fork's PR gets a read-only token and the step then fails harmlessly. There
# is no checkout and no third-party action; the only step is the `gh` CLI
# already on the runner, with the untrusted-looking values passed through
# `env:` rather than interpolated into the script.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the single job grants only what it needs.
permissions: {}

jobs:
  assign:
    if: github.actor != 'dependabot[bot]' && toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
