name: CI

# ONE required job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the `check`, `test:unit`, `build` and `docgen` tasks), not
# in GitHub Actions `needs:`. Copied in shape from the effect-web library.
# Nothing here needs a database, a stage or a credential, so every PR runs
# the whole gate — Dependabot's included: the job holds a read-only token, no
# secrets and no OIDC, checks out without persisting credentials, and every
# action is locked to its commit by .github/workflows/actions.lock
# (Dependabot's `github-actions` updates keep the tags current).

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Installs the catalog's vite-plus pin (`version-file`), the Node.js it
      # resolves (the latest LTS release: never a pre-release) and the pnpm
      # from `packageManager`, restores the dependency cache, and runs
      # `vp install --frozen-lockfile` with install scripts.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: vp check
      - name: Type gate (src + tests + example)
        run: vp run check
      - name: Unit tests (incl. the html5lib conformance gate)
        run: vp run test:unit
      - name: Build
        run: vp run build
      # Bundles Sax.forEach and Xml.parse from dist/ against their size budgets.
      - name: Bundle size
        run: vp run size
      # Type-checks AND runs every JSDoc @example against the built dist/.
      - name: Verify documentation examples (docgen)
        run: vp run docgen
      - name: Audit
        run: pnpm audit --audit-level high
