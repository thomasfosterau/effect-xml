# Dependabot version updates. A group exists only for dependencies that MUST
# move together (one release train, or a hard compatibility table), so
# updating one alone breaks the install or the build; everything else
# (`@effect/docgen`, `tsx`, `@effect/language-service`, `@enfect/oxlint`, the
# changesets CLI, fallow, `@types/node`, …) arrives as its own PR.
#
# - `effect`: the Effect release line is a lockstep singleton set (two copies
#   break Schema / Context identity; `@effect/platform-node` is released with
#   the same version). `@effect/tsgo` belongs to the toolchain set below.
# - `toolchain`: `@effect/tsgo` patches the native `tsc` (`@typescript/native`)
#   and the `oxlint` / `oxlint-tsgolint` that `vite-plus` pins, matched by
#   gitHead, and hard-errors (UnsupportedTargetPackageVersionError) at
#   `pnpm install` on any pairing it has no artifact for; `vitest` and
#   `@vitest/*` must equal vite-plus's own pins. Check the `components` table
#   in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before merging it.
#   `@enfect/oxlint` is not in it: it takes `@oxlint/plugins` as a range, so
#   nothing ties it to vite-plus's oxlint.
#
# Moved by hand, because Dependabot cannot bump them (do it in the toolchain
# PR that moves `vite-plus`):
# - the `vite` catalog entry, an npm alias
#   (`npm:@voidzero-dev/vite-plus-core@<vite-plus version>`);
# - the `typescript` (`npm:@typescript/typescript6@…`) and
#   `@typescript/native` (`npm:typescript@…`) aliases, only to a pairing the
#   new `@effect/tsgo`'s `components` table lists;
# - the `vite@*` / `vitest@*` / `effect` overrides, which follow their
#   catalog entries.
#
# `cooldown` is 1 day (Dependabot counts whole days), longer than
# pnpm-workspace.yaml's `minimumReleaseAge` of 8 hours, so a Dependabot PR
# never proposes a version pnpm would still refuse to install. First-party
# `@thomasfosterau/*` is exempt, as it is there.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
        # Exempt from pnpm's release-age hold too (the owner's call).
        - "@enfect/*"
    groups:
      # One release train: @effect/platform-node ships with the same version.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
          - "@effect/language-service"
        update-types:
          - "major"
          - "minor"
          - "patch"
      # vite-plus pins vitest / oxlint exactly; @effect/tsgo's patch supports
      # only the oxlint / tsgolint / tsc versions its components table lists.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
        update-types:
          - "major"
          - "minor"
          - "patch"
    assignees:
      - thomasfosterau
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
  # The .devcontainer/ features (the image tag moves with vite-plus by hand).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
