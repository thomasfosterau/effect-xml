# The library at the root and `packages/cli`. Every external version lives in
# this catalog (`catalogMode: strict`); run `pnpm install` after editing it.

packages:
  # Changesets only sees the root package when a glob matches it.
  - .
  - packages/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.2
  "@effect/language-service": ^0.87.5
  # Released in lockstep with `effect`: same version.
  "@effect/platform-node": 4.1.4
  # Released in lockstep with `effect`: same version.
  "@effect/vitest": 4.1.4
  # `effect-tsgo patch` supports only the `@typescript/native`, oxlint and
  # oxlint-tsgolint versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs; any other pairing fails
  # `pnpm install`. Move it with vite-plus and the TypeScript aliases.
  "@effect/tsgo": 0.67.5
  "@enfect/oxlint": ^0.10.0
  "@thomasfosterau/effect-parse": ^0.5.0
  "@types/node": ^26.6.6
  "@vitest/coverage-istanbul": 5.1.0
  effect: 4.1.4
  # bench/size.ts only.
  esbuild: ^0.28.2
  fallow: 3.43.1
  # Only because docgen spawns it to run the examples.
  tsx: ^4.23.15
  # TS6 (JS API, bin `tsc6`) for docgen, tsdown and the language service;
  # TS7 (`@typescript/native`, bin `tsc`) for type checking. Exact pins:
  # `@typescript/native` must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` must equal `vite-plus`, and `vitest` / `@vitest/coverage-istanbul`
  # the vitest it pins.
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0

# Peer ranges of the published package.
catalogs:
  peers:
    # The gates pass on both 0.4 and 0.5.
    "@thomasfosterau/effect-parse": ^0.4.1 || ^0.5.0
    # Raise only when a dependency requires more; raising it is breaking.
    effect: ^4.0.0

overrides:
  # Two copies of `effect` break Context / Schema identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    # @effect/docgen declares `typescript: ^5`.
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"

# Hold new releases for 24 hours (minutes); Dependabot's cooldown is 1 day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
  - "@enfect/*"
