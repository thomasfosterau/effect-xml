# pnpm workspace — the single published package `effect-sax` at the root.
#
# The `catalog:` protocol pins versions that MUST be singletons. Effect
# especially: two copies of `effect` break Context / Layer / Schema identity
# at runtime.
#
# EVERY external dependency version lives here — package.json references only
# `catalog:` / `catalog:peers`. `catalogMode: strict` makes `pnpm add` enforce
# this at add time and `pnpm install` reject non-catalog specifiers. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml — a stale lockfile fails CI at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions follow the effect-web library's catalog (the family's library
# reference) wherever the two overlap (effect, vite-plus, the TypeScript 6/7
# pair, @effect/tsgo, the Effect oxlint plugin, fallow).

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task); needs `tsx`
  # and a TypeScript JS API — the TS6 alias below satisfies its peer.
  "@effect/docgen": ^4.0.5
  "@effect/language-service": ^0.87.5
  # Tests only: the conformance gates read their fixtures' bytes through the
  # `FileSystem` service (`NodeFileSystem.layer`). Released in lockstep with
  # `effect`, so it is pinned to the same version.
  "@effect/platform-node": 4.0.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.55.0 ships against typescript 7.0.2)
  # and with the `oxlint` and `oxlint-tsgolint` that `vite-plus` pulls in
  # (0.55.0 supports oxlint 1.87.0 – 1.89.0 and tsgolint 7.0.2003 / 7.0.2004;
  # vite-plus 1.3.0 carries oxlint 1.88.0 and tsgolint 7.0.2004).
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.56.0
  # 0.6.0 depends on `effect` 4.0.0 (exact) and runs on the workspace
  # singleton (the `effect` override below), so no scoped override is needed.
  # Its `vite.config.ts` load calls Effect APIs, so an `effect` bump re-runs
  # `vp check` against the plugin too.
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  # Peer: the token, declaration and entity grammars are effect-parse parsers.
  "@thomasfosterau/effect-parse": ^0.1.0
  "@types/node": ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.0.5
  fallow: 3.34.1
  # Runs docgen's compiled examples and `vp run example`.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler, @effect/docgen) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.3.0 carries oxlint 1.88.0 on
  # vitest 5.0.5. `vite` is the same release under its aliased core package,
  # and `vitest` must match vite-plus's exact pin (1.3.0 → 5.0.5) because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton.
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest.
catalogs:
  peers:
    # Caret, not `>=`: on 0.x a minor release may break the combinator API
    # the grammars are written against.
    "@thomasfosterau/effect-parse": ^0.1.0
    # The floor the package declared before the tooling migration; raising it
    # is a breaking change.
    effect: ^4.0.5

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    # @effect/docgen declares `typescript: ^5`; the workspace's `typescript`
    # is the TS6 alias (see the catalog note).
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
